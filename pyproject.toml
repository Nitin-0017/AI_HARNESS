[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness-foundation"
version = "0.1.0"
description = "Phase 1: startup, configuration, state, and workspace isolation for an AI coding harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
