[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness-foundation"
version = "0.3.0"
description = "Phase 3: configurable model adapters on guarded repository tools"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
