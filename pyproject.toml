[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness-foundation"
version = "0.2.0"
description = "Phase 2: guarded repository tools, isolated execution, and Git evidence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
