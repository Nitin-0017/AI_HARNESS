# Public settings only. Credentials are forbidden here.
# Paths in this file are relative to THIS file, not the target repository.

[workspace]
# No default target: set HARNESS_WORKSPACE or pass --workspace /absolute/path.
# path = "/absolute/path/to/a/separate/target"

[logging]
output_dir = ".runs"
level = "INFO"

[model]
# Phase 3: ordinary startup and direct tools do not contact a model.
# Only --model-step or --model-health --live-health can request network activity.
# No endpoint, model ID, provider, request format, or response format is assumed.
# provider = "deepseek" # or "qwen"; NOT the exact model ID
# family remains a backwards-compatible alias for provider.
# model_id = "<organizer-confirmed-id>"
# endpoint = "<organizer-confirmed-full-endpoint>"
# request_format = "<organizer-confirmed-format>"
# response_format = "<explicitly-selected-supported-codec>"
# temperature = 0.2    # Omitted unless explicitly supplied.
# max_tokens = 2048
# timeout_seconds = 60.0
# max_retries = 2
# retry_backoff_seconds = 0.25
# max_response_bytes = 1048576

[budgets]
max_seconds = 300.0
max_iterations = 30
max_model_calls = 30
max_tool_calls = 100
max_test_executions = 20
max_total_tokens = 100000
max_context_chars = 64000
max_retries = 2
command_timeout_seconds = 60.0
model_timeout_seconds = 60.0
max_task_bytes = 64000

# Tool limits are separate from model budgets. No implicit shell access.
[tools]
max_file_bytes = 1000000
max_output_bytes = 262144
max_files = 10000
max_search_matches = 200
max_scan_bytes = 20000000
max_patch_files = 20
max_depth = 40

# A trusted operator must select checks appropriate for the target repository.
# This example is not enabled automatically:
# [[checks]]
# name = "unit"
# argv = ["{python}", "-m", "unittest", "discover", "-s", "tests", "-v"]
# timeout_seconds = 30.0
